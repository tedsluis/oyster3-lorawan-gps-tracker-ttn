[project]
name = "oyster3-lorawan-gps-tracker-ttn"
version = "0.2.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["json", "file", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
